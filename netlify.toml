[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SANITY_DATASET,VITE_SANITY_IMAGE_URL_PREFIX,VITE_SANITY_PROJECT_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.develop]
  command = "npm run build"
  publish = "dist"
